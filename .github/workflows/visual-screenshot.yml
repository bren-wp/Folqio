name: Capture Real Folqio Android Screens

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build Android app
        run: gradle :android:assembleDebug
      - name: Capture authentic Android app navigation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install -r android/build/outputs/apk/debug/android-debug.apk
            adb shell am start -n com.brendigo.folqio/.MainActivity
            python3 scripts/capture_android_ui.py
      - name: Archive only real captured screens
        uses: actions/upload-artifact@v4
        with:
          name: folqio-authentic-android-screens
          path: docs/media/android-*.png
          if-no-files-found: error
