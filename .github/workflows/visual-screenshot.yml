name: Capture Real Android Screenshot

on:
  push:
    branches:
      - feat/v0.1.4-release-polish-readme
    paths-ignore:
      - docs/media/android-home.png

permissions:
  contents: write

concurrency:
  group: folqio-visual-snapshot
  cancel-in-progress: true

jobs:
  screenshot:
    name: Capture running Android home
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v0.1.4-release-polish-readme
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build Android debug APK
        run: gradle :android:assembleDebug
      - name: Screenshot of actual app running in emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install -r android/build/outputs/apk/debug/android-debug.apk
            adb shell am start -n com.brendigo.folqio/.MainActivity
            sleep 7
            mkdir -p docs/media
            adb exec-out screencap -p > docs/media/android-home.png
            test -s docs/media/android-home.png
            file docs/media/android-home.png
      - name: Save authentic screenshot to this feature branch
        run: |
          test -s docs/media/android-home.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/media/android-home.png
          if git diff --cached --quiet; then
            echo "Screenshot unchanged"
          else
            git commit -m "docs: capture actual Android home screen in emulator"
            git push origin HEAD:refs/heads/feat/v0.1.4-release-polish-readme
          fi
