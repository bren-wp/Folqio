name: Folqio Development Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: folqio-release
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android 16 SDK
        run: |
          if [ -d "${ANDROID_HOME}/platforms/android-36" ]; then
            echo "Android API 36 already installed"
          else
            SDKMANAGER="$(find "${ANDROID_HOME}" -type f -name sdkmanager -print -quit)"
            if [ -z "$SDKMANAGER" ]; then
              echo "::error::Android SDK command-line tools missing on runner"
              exit 1
            fi
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" "platforms;android-36"
          fi
      - name: Test source audit rules
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Verify source and Google Play readiness
        run: python3 scripts/audit_source.py
      - name: Run Android unit tests and package
        run: gradle :android:testDebugUnitTest :android:lintDebug :android:assembleDebug :android:bundleRelease
      - name: Verify unsigned bundle and debug APK
        run: |
          test -s android/build/outputs/bundle/release/android-release.aab
          unzip -t android/build/outputs/bundle/release/android-release.aab >/dev/null
          test -s android/build/outputs/apk/debug/android-debug.apk
          unzip -t android/build/outputs/apk/debug/android-debug.apk >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: folqio-unsigned-aab
          path: android/build/outputs/bundle/release/android-release.aab
          if-no-files-found: error
      - name: Verify APK artifact exists
        run: |
          test -s android/build/outputs/apk/debug/android-debug.apk
          unzip -t android/build/outputs/apk/debug/android-debug.apk >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: folqio-development-apk
          path: android/build/outputs/apk/debug/android-debug.apk
          if-no-files-found: error

  publish:
    name: Publish debug-only prerelease
    needs: [android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: folqio-development-apk
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: folqio-unsigned-aab
          path: dist
      - name: Publish versioned development build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' android/build.gradle.kts | head -n 1)"
          test -n "$VERSION"
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists; not overwriting."
            exit 0
          fi
          cp dist/android-debug.apk "dist/Folqio-$TAG-Android-debug.apk"
          cp dist/android-release.aab "dist/Folqio-$TAG-Android-UNSIGNED.aab"
          NOTES_SOURCE="docs/releases/$VERSION.md"
          NOTES_DEST="$RUNNER_TEMP/folqio-release-notes.md"
          if [ -f "$NOTES_SOURCE" ]; then
            cp "$NOTES_SOURCE" "$NOTES_DEST"
          else
            printf 'Folqio %s — development prerelease. Review the README and roadmap for supported features.\n' "$TAG" > "$NOTES_DEST"
          fi
          {
            printf '\n---\n'
            printf '%s\n' '**Download safety:** The APK is **debug-signed** and for testing only.'
            printf '%s\n' 'The AAB is **UNSIGNED**, not ready for direct Play upload.'
            printf '%s\n' 'The iOS app builds for simulator; a distribution IPA needs Apple signing and provisioning.'
            printf '%s\n' 'This prerelease does not certify complete PDF editing or 1:1 physical-device UI parity.'
          } >> "$NOTES_DEST"
          gh release create "$TAG" "dist/Folqio-$TAG-Android-debug.apk" "dist/Folqio-$TAG-Android-UNSIGNED.aab" \
            --target "$GITHUB_SHA" \
            --title "Folqio $TAG — development preview" \
            --prerelease \
            --notes-file "$NOTES_DEST"
