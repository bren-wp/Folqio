name: Folqio Development Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: folqio-release
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android 16 SDK
        run: |
          if [ -d "${ANDROID_HOME}/platforms/android-36" ]; then
            echo "Android API 36 already installed"
          else
            SDKMANAGER="$(find "${ANDROID_HOME}" -type f -name sdkmanager -print -quit)"
            if [ -z "$SDKMANAGER" ]; then
              echo "::error::Android SDK command-line tools missing on runner"
              exit 1
            fi
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" "platforms;android-36"
          fi
      - name: Run Android unit tests and package
        run: gradle :android:testDebugUnitTest :android:lintDebug :android:assembleDebug :android:bundleRelease
      - name: Verify APK artifact exists
        run: |
          test -s android/build/outputs/apk/debug/android-debug.apk
          unzip -t android/build/outputs/apk/debug/android-debug.apk >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: folqio-development-apk
          path: android/build/outputs/apk/debug/android-debug.apk
          if-no-files-found: error

  ios:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate --spec ios/project.yml --project ios
      - name: Verify Xcode 26+ SDK baseline
        run: |
          xcodebuild -version
          python3 - <<'PY'
          import re, subprocess
          match = re.search(r"Xcode (\\d+)", subprocess.check_output(["xcodebuild", "-version"], text=True))
          if not match or int(match.group(1)) < 26:
              raise SystemExit("Xcode 26 or newer required")
          PY
      - name: Compile app and unit tests for iOS simulator
        run: |
          xcodebuild build-for-testing \
            -project ios/Folqio.xcodeproj \
            -scheme Folqio \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

  publish:
    name: Publish debug-only prerelease
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: folqio-development-apk
          path: dist
      - name: Publish versioned development build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' android/build.gradle.kts | head -n 1)"
          test -n "$VERSION"
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists; not overwriting."
            exit 0
          fi
          cp dist/android-debug.apk "dist/Folqio-$TAG-Android-debug.apk"
          gh release create "$TAG" "dist/Folqio-$TAG-Android-debug.apk" \
            --target "$GITHUB_SHA" \
            --title "Folqio $TAG — development preview" \
            --prerelease \
            --notes "Development preview only. Android APK is debug-signed, not Play Store-ready. iOS source is in this repository but cannot be distributed without Apple signing. See README and docs/ROADMAP.md for unimplemented features and 1:1 UI QA limitations."
