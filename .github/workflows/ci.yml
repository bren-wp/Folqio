name: Native CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android compile and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify native Android app
        run: gradle :android:testDebugUnitTest :android:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: folqio-android-debug
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  ios:
    name: iOS simulator build and tests
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate --spec ios/project.yml --project ios
      - name: Build iOS app
        run: |
          xcodebuild build \
            -project ios/Folqio.xcodeproj \
            -scheme Folqio \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            -quiet
      - name: Compile iOS unit tests
        run: |
          xcodebuild build-for-testing \
            -project ios/Folqio.xcodeproj \
            -scheme Folqio \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            -quiet
      - name: Run unit tests only on an already booted iPhone simulator
        run: |
          SIMULATOR_ID="$(python3 -c 'import json,subprocess; p=subprocess.run(["xcrun","simctl","list","devices","booted","-j"],stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,timeout=15,check=False); d=json.loads(p.stdout) if p.returncode == 0 else {"devices":{}}; print(next((x["udid"] for group in d.get("devices",{}).values() for x in group if "iPhone" in x.get("name","")), ""))' || true)"
          if [ -z "$SIMULATOR_ID" ]; then
            echo "::notice::No prebooted iPhone simulator is available. Unit-test compilation verified; execution must be run on a configured simulator or device."
          else
            xcodebuild test \
              -project ios/Folqio.xcodeproj \
              -scheme Folqio \
              -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
              CODE_SIGNING_ALLOWED=NO \
              -quiet
          fi
