name: Native CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android compile and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify native Android app
        run: gradle :android:testDebugUnitTest :android:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: folqio-android-debug
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  ios:
    name: iOS simulator build and tests
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate --spec ios/project.yml --project ios
      - name: Build and unit test
        run: |
          xcodebuild test \
            -project ios/Folqio.xcodeproj \
            -scheme Folqio \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO \
            -quiet
