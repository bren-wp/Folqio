name: Native CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android compile and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android 16 SDK
        run: |
          if [ -d "${ANDROID_HOME}/platforms/android-36" ]; then
            echo "Android API 36 already installed"
          else
            SDKMANAGER="$(find "${ANDROID_HOME}" -type f -name sdkmanager -print -quit)"
            if [ -z "$SDKMANAGER" ]; then
              echo "::error::Android SDK command-line tools missing on runner"
              exit 1
            fi
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" "platforms;android-36"
          fi
      - name: Test source audit rules
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Verify source and store readiness basics
        run: python3 scripts/audit_source.py
      - name: Verify native Android app
        run: gradle :android:testDebugUnitTest :android:assembleDebug :android:lintDebug :android:bundleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: folqio-release-aab-unsigned
          path: android/build/outputs/bundle/release/*.aab
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: folqio-android-debug
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
